# Ground anchor sources (v2 seed)
#
# Anchors are admin-curated source priors. Each entry pins a baseline
# credibility and tier for a source URL; the runtime EigenTrust pass blends
# anchor priors with the citation graph and audit aggregate to derive the
# computed credibility per epoch. Lenses can override per-source values, but
# the anchor list is the public-baseline source of trust.
#
# Tier conventions:
#   1 — Primary literature (peer-reviewed top journals, government datasets,
#       original publications of named results, official prize bodies).
#   2 — Reputable secondary references (Wikipedia, Stanford Encyclopedia of
#       Philosophy, encyclopedic monographs). Allowed for definitional claims.
#   3 — Reputable but mixed (mainstream news, established blogs, preprint
#       servers without peer review). Use sparingly as anchor-priors.
#
# Adding/removing an anchor is a deliberate, reviewable change. Keep the list
# small and well-justified. Run `./ground bootstrap-anchors anchors.yaml` after
# editing.

